name: DEVDОCK Build and Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: devdock-windows
          path: release/*.exe
          if-no-files-found: error

  windows-arm64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run dist:win:arm64
      - uses: actions/upload-artifact@v4
        with:
          name: devdock-windows-arm64
          path: release/*.exe
          if-no-files-found: error
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: devdock-linux
          path: release/*.AppImage
          if-no-files-found: error
  publish:
    needs: [windows, windows-arm64, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: devdock-*
          path: release
          merge-multiple: true
      - name: Publish new version once
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; no overwrite"
          else
            gh release create "$TAG" release/*.exe release/*.AppImage \
              --target "$GITHUB_SHA" --title "DEVDОCK $TAG" \
              --notes "DEVDОCK $TAG — instaladores Windows y Linux. Guarda tus datos locales y consulta las novedades en el README."
          fi
